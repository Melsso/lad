services:
  nginx:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.nginx
    container_name: lad-nginx
    ports:
      - "8000:80"
    depends_on:
      - api
    networks:
      - lad-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    volumes:
      - ./chat_sandboxes:/data/chat_sandboxes
    networks:
      - lad-network
      - sandbox-network
    expose:
      - "8000"
    labels:
      service: "api"

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    volumes:
      - ./chat_sandboxes:/data/chat_sandboxes
    networks:
      - sandbox-network
    mem_limit: 512m
    cpus: 0.5
    labels:
      service: "sandbox"

volumes:
  postgres_data:

networks:
  lad-network:
    external: true
  sandbox-network: {}