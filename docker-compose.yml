services:
  nginx:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.nginx
    container_name: lad-nginx
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - api
    networks:
      - lad-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      ALLOWED_CLIENT_HOSTS: lad-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sandbox:
        condition: service_healthy
    volumes:
      - ./chat_sandboxes:/data/chat_sandboxes
    networks:
      - lad-network
      - sandbox-network
    expose:
      - "8000"

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    volumes:
      - ./chat_sandboxes:/data/chat_sandboxes
    networks:
      - sandbox-network
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  lad-network:
    external: true
  sandbox-network:
    internal: true