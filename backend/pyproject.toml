[project]
name = "lad"
version = "0.1.0"
description = ""
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "mcp (>=2.1.1,<3.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "pytest (>=8.4.2,<9.0.0)",
    "pytest-cov (>=6.2.1,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "testcontainers[postgres] (>=4.15.0,<5.0.0)"
]

[tool.poetry]
packages = [{include = "lad", from = "src"}]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
addopts = "-ra"

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"