[project]
name = "lad"
version = "0.1.0"
description = ""
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)"
]

[tool.poetry]
packages = [{include = "lad", from = "src"}]

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
