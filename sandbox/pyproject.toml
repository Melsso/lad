[project]
name = "sandbox"
version = "0.1.0"
description = ""
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (==0.115.6)",
    "uvicorn (==0.34.0)",
    "pydantic (==2.10.4)",
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "sandbox", from = "src"}]


[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "-ra"

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = false

[tool.pydantic-mypy]
init_typed = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"