[project]
name = "sandbox"
version = "0.1.0"
description = "LAD sandbox: isolated command execution service"
authors = [
    {name = "Mallem Sofiane",email = "melsopv@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "pydantic (>=2.10.4,<3.0.0)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4.2,<9.0.0"
pytest-cov = ">=6.2.1,<7.0.0"
httpx = ">=0.28.1,<0.29.0"
ruff = ">=0.16.5,<0.17.0"
mypy = ">=2.3.1,<3.0.0"

[tool.poetry]
packages = [{include = "sandbox", from = "src"}]


[tool.pytest.ini_options]
testpaths = ["tests/"]
addopts = "-ra -p no:cacheprovider"

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = false
incremental = false

[tool.pydantic-mypy]
init_typed = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"