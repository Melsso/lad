name: Sandbox CI

on:
  push:
    branches: [dev]
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "sandbox/**"
      - ".github/workflows/sandbox-ci.yml"

defaults:
  run:
    working-directory: sandbox

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-sandbox-${{ hashFiles('sandbox/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-sandbox-

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type Check
        run: poetry run mypy .

      - name: Tests
        run: poetry run pytest tests/ --cov=sandbox --cov-report=term-missing