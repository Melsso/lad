name: Backend CI

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: ci
      DB_HOST: localhost
      DB_PORT: "5432"


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Type Check
        run: poetry run mypy .

      - name: Unit Tests
        run: poetry run pytest tests/unit_tests --cov=lad --cov-report=term-missing
      
      - name: Integration Tests
        run: poetry run pytest tests/integration_tests --cov=lad --cov-report=term-missing